<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店舗一覧 - 古今歌舞伎町音声巡り</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>
<body class="main">

    <header id="footer" class="bg-white shadow-sm sticky top-0 z-50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold section-title">店舗一覧</h1>
            <a href="index.html" id="back-to-main-btn" class="bg-gray-200 hover:bg-gray-300 text-white font-bold py-2 px-4 rounded-full transition duration-300">
                メインに戻る
            </a>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-12">
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <a href="shop-detail-1.html" class="card rounded-lg overflow-hidden group block">
                <img src="https://placehold.co/600x400/f0f2f5/FF69B4?text=店舗1" alt="店舗1の画像" class="w-full h-48 object-cover group-hover:opacity-80 transition-opacity">
                <div class="p-5">
                    <h3 class="text-xl font-bold mb-2">老舗ジャズ喫茶「JAZZ BAR XYZ」</h3>
                    <p class="text-gray-600">昭和から続く、伝説のジャズ喫茶。当時のレコードがそのままに。</p>
                </div>
            </a>

            <a href="shop-detail-2.html" class="card rounded-lg overflow-hidden group block">
                <img src="https://placehold.co/600x400/f0f2f5/FF69B4?text=店舗2" alt="店舗2の画像" class="w-full h-48 object-cover group-hover:opacity-80 transition-opacity">
                <div class="p-5">
                    <h3 class="text-xl font-bold mb-2">ネオ大衆酒場「カブキノヨアケ」</h3>
                    <p class="text-gray-600">新しい歌舞伎町を象徴する、カラフルな内装が人気のお店。</p>
                </div>
            </a>

            <div class="card rounded-lg overflow-hidden bg-gray-50">
                <div class="w-full h-48 bg-gray-200 flex items-center justify-center">
                    <p class="text-gray-400">Comming Soon</p>
                </div>
                <div class="p-5">
                    <h3 class="text-xl font-bold mb-2 text-gray-400">近日公開</h3>
                    <p class="text-gray-500">新しいお店の情報を準備中です。</p>
                </div>
            </div>

        </div>
    </main>

    <footer id="footer" class="text-center py-8 mt-16 footer">
        <p class="text-sm">&copy; 2025 東京国際工科専門職大学. All Rights Reserved.</p>
    </footer>

</body>
</html>
