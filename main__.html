<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="stylesheet" type="text/css" href="./main.css" />
</head>
<body>
    <header>
       <box class="headerbox">
        <a id="btn_menu" class="btn_menu" href="#">
            <span>
                <spawn>
                </spawn>
            </span>
        </a> 
       </box>
    </header>

<img class="kabukicho" src="./source/img/kabukicho2.webp">

<div class="map-container">
    <div id="map"></div>
</div>
<script>
    let map;
    let pins = [];
    let addPinModeActive = false;
    let audioContext;
    let customAudioFiles = new Map();

    const KABUKICHO_CENTER =  { lat: 35.6944, lng: 139.7035};

    function initMap() {
        map = new google.maps.Map(document.getElementById('map'),{
            zoom: 16,
            center: KABUKICHO_CENTER,
            styles: [
                    {
                        "featureType": "all",
                        "elementType": "geometry.fill",
                        "stylers": [{"weight": "2.00"}]
                    },
                    {
                        "featureType": "all",
                        "elementType": "geometry.stroke",
                        "stylers": [{"color": "#9c9c9c"}]
                    },
                    {
                        "featureType": "all",
                        "elementType": "labels.text",
                        "stylers": [{"visibility": "on"}]
                    }
                ]
        });

    }

    window.onload = function() {
        if (typeof google !== 'underfined' && google.maps) {
            initMap();
        } else {
            document.getElementById('map').innerHTML = `
                    <div style="display: flex; justify-content: center; align-items: center; height: 100%; background: #f0f0f0; border-radius: 10px;">
                        <p style="color: #666; font-size: 18px;">Google Maps APIを読み込んでいます...</p>
                    </div>
                `;
        }
    };
</script>
    <script src="config.js"></script>
<script>
    function loadGoogleMapsAPI(){
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${Config.GOOGLE_MAPS_API_KEY}&callback=initMap&libraries=geometry`;
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);
    }

    window.addEventListener('load', loadGoogleMapsAPI);
</script>
</body>
</html>
